<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>By the homeworld I hope to see one day with you</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/icons/n7.png">
</head>

<body>
  <div id="game-container">
    <!-- Background Scene -->
    <img id="scene-background" src="assets/backgrounds/black.jpg" alt="Background Scene">

    <!-- Scanlines & Sci-Fi Vignette Overlay -->
    <div class="scanlines-overlay"></div>

    <!-- Top HUD Status Bar -->
    <header id="top-hud">
      <div class="hud-left">
        <span class="hud-logo">N7 // ARCHIVE</span>
        <span id="chapter-title">A Third Chance</span>
      </div>
      <div class="hud-right">
        <button id="btn-chapters" class="hud-btn" title="Open Chapter Selector">Chapters</button>
        <button id="btn-mute" class="hud-btn" title="Audio disabled">🔇 Audio Off</button>
        <button id="btn-restart" class="hud-btn" title="Restart Scene">Restart</button>
      </div>
    </header>

    <!-- Character Stage (Solo Centered & Dual Left/Right with Dynamic Lighting) -->
    <main id="stage" class="mode-single">
      <img id="portrait-center" class="portrait" src="" alt="Solo Character">
      <img id="portrait-left" class="portrait" src="" alt="Left Character">
      <img id="portrait-right" class="portrait" src="" alt="Right Character">
    </main>

    <!-- Moral Interrupts Without Timers (Paragon & Renegade - Icons Only) -->
    <aside id="interrupt-paragon" class="interrupt-btn" title="Paragon [Q]" aria-label="Trigger Paragon Interrupt">
      <div class="interrupt-icon-box">
        <img src="assets/icons/paragon.png" alt="Paragon Icon">
      </div>
    </aside>

    <aside id="interrupt-renegade" class="interrupt-btn" title="Renegade [E]" aria-label="Trigger Renegade Interrupt">
      <div class="interrupt-icon-box">
        <img src="assets/icons/renegate.png" alt="Renegade Icon">
      </div>
    </aside>

    <!-- Baldur's Gate Style Dialogue Choice List -->
    <section id="choice-container">
      <nav id="choice-list"></nav>
    </section>

    <!-- Dialogue Layer -->
    <footer id="dialogue-layer">
      <div id="dialogue-box">
        <div class="speaker-header">
          <span id="speaker-name">COMMANDER SHEPARD</span>
          <span id="speaker-title">// N7 Infiltrator</span>
        </div>
        <p id="dialogue-text">Initializing neural telemetry...</p>
        <div id="advance-prompt">
          <span>ADVANCE [SPACE]</span>
          <span class="prompt-arrow">▶</span>
        </div>
      </div>
    </footer>

    <!-- Chapters Screen (Opens directly on screen load) -->
    <div id="chapter-modal" class="visible">
      <div class="modal-box chapter-terminal">
        <header class="modal-header">
          <div class="modal-title-box">
            <span class="hud-logo">N7 // ARCHIVE</span>
          </div>
        </header>

        <div class="chapter-content">
          <h1 id="story-title" class="story-title">By the homeworld I hope to see one day with you</h1>
          <h2 class="chapters-heading">Chapters</h2>
          <div id="chapters-list" class="chapters-list">
            <button class="chapter-row playable active" data-number="1">
              <span class="chapter-row-num">1.</span>
              <span class="chapter-row-title">A Third Chance</span>
              <span class="chapter-row-badge badge-play">▶ Play</span>
            </button>
            <div class="chapter-row locked" data-number="2">
              <span class="chapter-row-num">2.</span>
              <span class="chapter-row-title">Dossier: Shadow Broker</span>
              <span class="chapter-row-badge badge-coming-soon">Coming Soon</span>
            </div>
            <div class="chapter-row locked" data-number="3">
              <span class="chapter-row-num">3.</span>
              <span class="chapter-row-title">Dossier: Archangel</span>
              <span class="chapter-row-badge badge-coming-soon">Coming Soon</span>
            </div>
            <div class="chapter-row locked" data-number="4">
              <span class="chapter-row-num">4.</span>
              <span class="chapter-row-title">Priority: Cerberus</span>
              <span class="chapter-row-badge badge-coming-soon">Coming Soon</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Engine Controller ES Module -->
  <script type="module" src="js/engine.js"></script>
</body>

</html>
